# Expected rows oracle for 500-query mega benchmark
# Used by unified_benchmark.rs to distinguish engine bugs from corpus coverage gaps.
#
# Statuses:
#   non_empty      — default; ≥1 row → pass
#   data_dependent — 0 rows is acceptable (loader gap or dataset slice)
#   aggregation    — single-row numeric result; 0-value OK
#   exact          — must return exactly `rows`
#   range          — row count must be in [min, max]
#
# Any ID not listed inherits default = non_empty.

version: 1
queries:
  # ── B1: Drug name-case mismatch across KGs ──
  MB020: { status: data_dependent, reason: "Drug{name:'Aspirin'} — FAERS uses 'ASPIRIN'" }
  MB035: { status: data_dependent, reason: "Aspirin side-effects — name case" }
  MB037: { status: data_dependent, reason: "Ibuprofen gene targets — name case" }
  MB150: { status: data_dependent, reason: "Atorvastatin targets — name case" }
  MB203: { status: data_dependent, reason: "Lithium — may not be in DrugBank slice" }
  MB180: { status: data_dependent, reason: "Aspirin target overlap — cascade of B1" }
  FA30:  { status: data_dependent, reason: "ASPIRIN (FAERS) → Aspirin (DrugBank) bridge" }

  # ── B2: Loader / KG coverage gaps ──
  CT18:  { status: data_dependent, reason: "CODED_AS_DRUG not emitted by CT loader" }
