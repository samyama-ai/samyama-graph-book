name: Build Research Paper PDF

on:
  push:
    paths:
      - 'research/**'
  workflow_dispatch:

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Pandoc & Graphics Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc librsvg2-bin

      - name: Install Tectonic
        uses: wtfjoke/setup-tectonic@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert Markdown to PDF
        run: |
          # Change directory to 'research' so relative image paths (./images/...) resolve correctly
          cd research
          pandoc samyama_paper.md -o ../samyama_paper.pdf --pdf-engine=tectonic \
            -H header.tex \
            -V geometry:margin=1in \
            -V fontsize=11pt \
            -V colorlinks=true \
            --resource-path=.

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: samyama-research-paper
          path: samyama_paper.pdf

      - name: Convert SVG figures to PDF for arxiv
        run: |
          cd research
          for f in images/*.svg; do
            rsvg-convert -f pdf -o "arxiv/figures/$(basename "$f" .svg).pdf" "$f"
          done

      - name: Build Paper 1 arxiv LaTeX
        run: |
          cd research/arxiv
          tectonic samyama.tex

      - name: Build Paper 3 arxiv LaTeX
        run: |
          cd research/arxiv
          tectonic paper3_industrial_kg.tex
          # bibtex is handled by tectonic automatically

      - name: Upload Paper 1 arxiv artifact
        uses: actions/upload-artifact@v4
        with:
          name: samyama-arxiv
          path: |
            research/arxiv/samyama.tex
            research/arxiv/samyama.bib
            research/arxiv/samyama.pdf
            research/arxiv/figures/

      - name: Upload Paper 3 arxiv artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper3-industrial-kg-arxiv
          path: |
            research/arxiv/paper3_industrial_kg.tex
            research/arxiv/paper3_industrial_kg.bib
            research/arxiv/paper3_industrial_kg.pdf

      - name: Create arxiv tarballs and copy PDFs for release
        run: |
          cd research/arxiv
          # Paper 1 tarball
          tar czf ../../samyama-arxiv.tar.gz samyama.tex samyama.bib figures/
          cp samyama.pdf ../../samyama_arxiv.pdf
          # Paper 3 tarball
          tar czf ../../paper3-industrial-kg-arxiv.tar.gz paper3_industrial_kg.tex paper3_industrial_kg.bib
          cp paper3_industrial_kg.pdf ../../paper3_industrial_kg.pdf

      - name: Release PDFs and tarballs
        uses: softprops/action-gh-release@v1
        if: github.ref == 'refs/heads/main'
        with:
          files: |
            samyama_paper.pdf
            samyama_arxiv.pdf
            samyama-arxiv.tar.gz
            paper3_industrial_kg.pdf
            paper3-industrial-kg-arxiv.tar.gz
          tag_name: latest
          body: |
            Latest versions of the Samyama research papers.

            **Paper 1 — Samyama: Unified Graph-Vector Database**
            - **samyama_paper.pdf** — Pandoc-generated PDF from Markdown
            - **samyama_arxiv.pdf** — arxiv-ready LaTeX PDF (v0.6.0)
            - **samyama-arxiv.tar.gz** — arxiv upload bundle (tex + bib + figures)

            **Paper 3 — Knowledge Graphs for Industrial Asset Operations**
            - **paper3_industrial_kg.pdf** — arxiv-ready LaTeX PDF
            - **paper3-industrial-kg-arxiv.tar.gz** — arxiv upload bundle (tex + bib)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
