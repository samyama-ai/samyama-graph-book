name: Build Research Paper PDF

on:
  push:
    paths:
      - 'research/**'
      - '.github/workflows/paper.yml'
  workflow_dispatch:

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Pandoc & Graphics Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc librsvg2-bin

      - name: Install Tectonic
        uses: wtfjoke/setup-tectonic@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert Markdown to PDF
        run: |
          cd research
          pandoc samyama_paper.md -o ../samyama_paper.pdf --pdf-engine=tectonic \
            -H header.tex \
            -V geometry:margin=1in \
            -V fontsize=11pt \
            -V colorlinks=true \
            --resource-path=.

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: samyama-research-paper
          path: samyama_paper.pdf

      - name: Convert SVG figures to PDF
        run: |
          cd research
          for f in images/*.svg; do
            rsvg-convert -f pdf -o "shared/figures/$(basename "$f" .svg).pdf" "$f"
          done

      - name: Build Paper 1 (Samyama Systems)
        run: |
          cd research/paper1-samyama-systems
          ln -sf ../shared/acmart.cls .
          ln -sf ../shared/figures .
          tectonic samyama.tex

      - name: Build Paper 3 (Industrial KG)
        run: |
          cd research/paper3-industrial-kg
          ln -sf ../shared/acmart.cls .
          ln -sf ../shared/figures .
          tectonic paper3_industrial_kg.tex

      - name: Build Paper 7 (Billion-Edge Federation)
        run: |
          cd research/paper7-billion-edge
          if [ -f paper7_billion_edge.tex ]; then
            ln -sf ../shared/acmart.cls .
            ln -sf ../shared/figures .
            tectonic paper7_billion_edge.tex
          else
            echo "Paper 7 tex not yet created, skipping"
          fi

      - name: Create release artifacts
        run: |
          # Paper 1
          cd research/paper1-samyama-systems
          tar czf ../../samyama-arxiv.tar.gz samyama.tex samyama.bib
          cp samyama.pdf ../../samyama_arxiv.pdf 2>/dev/null || true

          # Paper 3
          cd ../paper3-industrial-kg
          tar czf ../../paper3-industrial-kg-arxiv.tar.gz paper3_industrial_kg.tex paper3_industrial_kg.bib
          cp paper3_industrial_kg.pdf ../../paper3_industrial_kg.pdf 2>/dev/null || true

          # Paper 7
          cd ../paper7-billion-edge
          if [ -f paper7_billion_edge.pdf ]; then
            tar czf ../../paper7-billion-edge-arxiv.tar.gz paper7_billion_edge.tex paper7_billion_edge.bib
            cp paper7_billion_edge.pdf ../../paper7_billion_edge.pdf
          fi

      - name: Release PDFs and tarballs
        uses: softprops/action-gh-release@v1
        if: github.ref == 'refs/heads/main'
        with:
          files: |
            samyama_paper.pdf
            samyama_arxiv.pdf
            samyama-arxiv.tar.gz
            paper3_industrial_kg.pdf
            paper3-industrial-kg-arxiv.tar.gz
            paper7_billion_edge.pdf
            paper7-billion-edge-arxiv.tar.gz
          tag_name: latest
          body: |
            Latest versions of the Samyama research papers.

            **Paper 1 — Samyama: Unified Graph-Vector Database** (arxiv:2603.08036)
            - samyama_arxiv.pdf — arxiv-ready LaTeX PDF
            - samyama-arxiv.tar.gz — arxiv upload bundle

            **Paper 3 ��� Knowledge Graphs for Industrial Asset Operations** (NeurIPS E&D target)
            - paper3_industrial_kg.pdf
            - paper3-industrial-kg-arxiv.tar.gz

            **Paper 7 — Billion-Edge KG Federation** (new)
            - paper7_billion_edge.pdf
            - paper7-billion-edge-arxiv.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
